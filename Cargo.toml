[package]
name = "uroman"
authors = ["o24s <fulmlumo@gmail.com>"]
version = "0.7.0"
edition = "2024"
repository = "https://github.com/stellanomia/uroman-rs"
description = "A self-contained Rust reimplementation of the uroman universal romanizer."
readme = "README.md"
license = "Apache-2.0"
build = "build.rs"
keywords = ["uroman", "romanization", "unicode", "nlp", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "uroman-rs"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-properties = "0.1.4"
num-rational = { version = "0.4.2", features = ["serde"] }
rkyv = "0.8.18"
memmap2 = { version = "0.9.11", optional = true }
thiserror = "2.0.19"

clap = { version = "4.6.4", features = ["derive"], optional = true }
rustyline = { version = "18.0.1", features = ["derive"], optional = true }
dirs = { version = "6.0.0", optional = true }
unicode-width = { version = "0.2.2", optional = true }
rayon = "1.12.0"

[build-dependencies]
rkyv = "0.8.18"
regex = "1.13.1"
serde_json = "1.0.151"
unicode_names2 = "3.1.0"
unicode-properties = "0.1.4"
unicode-normalization = "0.1.25"

[dev-dependencies]
predicates = "3.1.4"

[[test]]
name = "unit_test"
path = "tests/unit_tests.rs"
harness = true

[features]
default = []
mmap = ["dep:memmap2"]
cli = [
    "dep:clap",
    "dep:rustyline",
    "dep:dirs",
    "dep:unicode-width",
]
